name: Build Editor

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Upgrade @do-md/core-react to latest
        run: npm update @do-md/core-react

      - run: npm run build-editor

      - name: Commit and push build artifacts
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add static/js/editor.js static/css/editor.css package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build editor artifacts [skip ci]"
            git push origin HEAD
          fi
